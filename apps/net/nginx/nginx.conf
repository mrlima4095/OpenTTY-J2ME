# OpenTTY Nginx Configuration
# /etc/nginx/nginx.conf - created by 'nginx start' when missing.
# One directive per line; '#' starts a comment.

listen 80;
root /home/;
index index.html;
server_name OpenTTY;
worker_processes 1;
max_clients 10;
error_log /tmp/nginx-error.log;
access_log /tmp/nginx-access.log;
