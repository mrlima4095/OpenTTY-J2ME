set timeout=3
set default=0

menuentry "OpenTTY" {
    root=/
    init=/bin/init
}

# Boot Menu do OpenTTY
# --------------------
# Este arquivo vive em /boot/grub.cfg (VFS/RMS) e pode ser sobrescrito
# do proprio sistema. O kernel o le na hora do boot:
#
#   set timeout=N     segundos ate bootar o default (0 = espera o usuario)
#   set default=0     entrada padrao (indice ou titulo entre aspas)
#
#   menuentry "Titulo" {
#       root=/   ou   root=/mnt/Card/OpenTTY   <- raiz do sistema
#       init=/bin/init                          <- executavel do PID 1
#   }
#
# root=/ boota o OpenTTY normal (RMS). Com root=/mnt/... o / passa a
# ser aquela pasta do FileConnection (chroot), enquanto /boot, /proc,
# /tmp, /mnt e /dev continuam sendo os originais (nunca mudam).
#
# Exemplo comentado - uma segunda entrada com chroot no cartao:
# menuentry "OpenTTY SD (chroot)" {
#     root=/mnt/Card/OpenTTY
#     init=/bin/init
# }